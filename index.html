<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusLoop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#182230",
              mist: "#f5f7fb",
              sage: "#7bb49d",
              coral: "#f08f7f",
              lilac: "#a99cf3",
            },
            boxShadow: {
              soft: "0 24px 70px rgba(30, 41, 59, 0.12)",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-mist text-ink">
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;

      function buildReply(input) {
        const text = input.toLowerCase();

        if (
          text.includes("instagram") ||
          text.includes("tiktok") ||
          text.includes("youtube") ||
          text.includes("twitter") ||
          text.includes("social") ||
          text.includes("scroll") ||
          text.includes("phone") ||
          text.includes("distraction")
        ) {
          return {
            type: "timer",
            title: "Let's make the next move tiny.",
            message:
              "Put the distraction out of reach and give me just 5 minutes. Your only job is to start, not to finish.",
            action: "Start 5-min focus timer",
          };
        }

        if (
          text.includes("too big") ||
          text.includes("overwhelm") ||
          text.includes("overwhelmed") ||
          text.includes("huge") ||
          text.includes("massive") ||
          text.includes("don't know where to start") ||
          text.includes("dont know where to start")
        ) {
          return {
            type: "steps",
            title: "Big tasks need a smaller doorway.",
            message: "Try this 3-step version for the next 15 minutes:",
            steps: [
              "Open the file, tab, book, or workspace.",
              "Write the roughest possible first sentence or checklist.",
              "Do one visible action that future-you can continue from.",
            ],
          };
        }

        if (
          text.includes("anxiety") ||
          text.includes("anxious") ||
          text.includes("panic") ||
          text.includes("scared") ||
          text.includes("afraid") ||
          text.includes("worried") ||
          text.includes("stress")
        ) {
          return {
            type: "reframe",
            title: "This feeling is loud, but it is not the boss.",
            message:
              "You do not need to feel ready before beginning. Take one slow breath, name the next tiny action, and let momentum arrive after the first step.",
          };
        }

        return {
          type: "default",
          title: "Let's shrink the starting line.",
          message:
            "Set a 10-minute promise: touch the task, make one small change, and stop judging the whole project for now.",
        };
      }

      function App() {
        const [screen, setScreen] = useState("home");
        const [input, setInput] = useState("");
        const [timerRunning, setTimerRunning] = useState(false);
        const [secondsLeft, setSecondsLeft] = useState(300);
        const reply = useMemo(() => buildReply(input), [input]);

        useEffect(() => {
          if (!timerRunning || secondsLeft <= 0) return;
          const timer = setInterval(() => setSecondsLeft((time) => time - 1), 1000);
          return () => clearInterval(timer);
        }, [timerRunning, secondsLeft]);

        function handleCheckIn(event) {
          event.preventDefault();
          if (!input.trim()) return;
          setScreen("response");
        }

        function resetDemo() {
          setInput("");
          setScreen("home");
          setTimerRunning(false);
          setSecondsLeft(300);
        }

        const minutes = String(Math.floor(secondsLeft / 60)).padStart(2, "0");
        const seconds = String(secondsLeft % 60).padStart(2, "0");

        return (
          <main className="min-h-screen px-4 py-6 sm:px-6 lg:px-8">
            <section className="mx-auto flex min-h-[calc(100vh-48px)] max-w-5xl flex-col">
              <nav className="flex items-center justify-between py-3">
                <button
                  onClick={resetDemo}
                  className="group flex items-center gap-3 rounded-full bg-white/80 px-3 py-2 shadow-sm ring-1 ring-slate-200 transition hover:bg-white"
                  aria-label="Reset FocusLoop demo"
                >
                  <span className="grid h-9 w-9 place-items-center rounded-full bg-ink text-sm font-black text-white">
                    FL
                  </span>
                  <span className="hidden text-left sm:block">
                    <span className="block text-sm font-bold leading-none">FocusLoop</span>
                    <span className="text-xs text-slate-500">AI procrastination check-ins</span>
                  </span>
                </button>

                <div className="flex items-center gap-2 rounded-full bg-white p-1 shadow-sm ring-1 ring-slate-200">
                  {["home", "response", "progress"].map((item, index) => (
                    <button
                      key={item}
                      onClick={() => (item === "home" || input.trim() ? setScreen(item) : null)}
                      className={`h-8 rounded-full px-3 text-xs font-semibold capitalize transition ${
                        screen === item
                          ? "bg-ink text-white"
                          : input.trim() || item === "home"
                          ? "text-slate-500 hover:bg-slate-100"
                          : "cursor-not-allowed text-slate-300"
                      }`}
                    >
                      {index + 1}. {item === "home" ? "Check-in" : item}
                    </button>
                  ))}
                </div>
              </nav>

              <div className="grid flex-1 items-center gap-8 py-8 lg:grid-cols-[1fr_360px]">
                <section className="overflow-hidden rounded-[2rem] bg-white shadow-soft ring-1 ring-slate-200">
                  <div className="border-b border-slate-100 bg-gradient-to-r from-white via-emerald-50 to-violet-50 px-5 py-4 sm:px-8">
                    <div className="flex items-center justify-between gap-4">
                      <div>
                        <p className="text-xs font-bold uppercase tracking-[0.22em] text-sage">
                          Hackathon demo
                        </p>
                        <h1 className="mt-1 text-2xl font-black tracking-tight sm:text-3xl">
                          Beat the first five minutes.
                        </h1>
                      </div>
                      <div className="hidden rounded-full bg-white px-4 py-2 text-sm font-semibold text-slate-600 shadow-sm ring-1 ring-slate-200 sm:block">
                        Static prototype
                      </div>
                    </div>
                  </div>

                  {screen === "home" && (
                    <div className="p-5 sm:p-8">
                      <div className="mb-6 flex gap-3">
                        <div className="grid h-10 w-10 shrink-0 place-items-center rounded-2xl bg-sage text-sm font-black text-white">
                          AI
                        </div>
                        <div className="max-w-[85%] rounded-3xl rounded-tl-md bg-slate-100 px-5 py-4 text-sm leading-6 text-slate-700">
                          What are you procrastinating on right now? Tell me the messy version.
                        </div>
                      </div>

                      <form onSubmit={handleCheckIn} className="space-y-4">
                        <textarea
                          value={input}
                          onChange={(event) => setInput(event.target.value)}
                          rows="6"
                          className="w-full resize-none rounded-3xl border border-slate-200 bg-slate-50 px-5 py-4 text-base leading-7 outline-none transition placeholder:text-slate-400 focus:border-sage focus:bg-white focus:ring-4 focus:ring-emerald-100"
                          placeholder="Example: I keep opening Instagram instead of studying..."
                        />
                        <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                          <div className="flex flex-wrap gap-2">
                            {[
                              "Instagram instead of studying",
                              "This project feels too big",
                              "I'm anxious about starting",
                            ].map((sample) => (
                              <button
                                type="button"
                                key={sample}
                                onClick={() => setInput(sample)}
                                className="rounded-full bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-600 transition hover:bg-slate-200"
                              >
                                {sample}
                              </button>
                            ))}
                          </div>
                          <button
                            type="submit"
                            className="rounded-full bg-ink px-6 py-3 text-sm font-bold text-white shadow-lg shadow-slate-300 transition hover:-translate-y-0.5 hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-40"
                            disabled={!input.trim()}
                          >
                            Check in
                          </button>
                        </div>
                      </form>
                    </div>
                  )}

                  {screen === "response" && (
                    <div className="p-5 sm:p-8">
                      <div className="mb-5 flex justify-end">
                        <div className="max-w-[85%] rounded-3xl rounded-tr-md bg-ink px-5 py-4 text-sm leading-6 text-white">
                          {input}
                        </div>
                      </div>

                      <div className="mb-6 flex gap-3">
                        <div className="grid h-10 w-10 shrink-0 place-items-center rounded-2xl bg-sage text-sm font-black text-white">
                          AI
                        </div>
                        <div className="max-w-[88%] rounded-3xl rounded-tl-md bg-slate-100 px-5 py-4">
                          <p className="font-bold text-ink">FocusLoop AI</p>
                          <h2 className="mt-3 text-xl font-black tracking-tight">{reply.title}</h2>
                          <p className="mt-3 text-sm leading-6 text-slate-700">{reply.message}</p>

                          {reply.steps && (
                            <ol className="mt-4 space-y-3">
                              {reply.steps.map((step, index) => (
                                <li key={step} className="flex gap-3 text-sm text-slate-700">
                                  <span className="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-white text-xs font-black text-sage ring-1 ring-emerald-100">
                                    {index + 1}
                                  </span>
                                  <span className="pt-1">{step}</span>
                                </li>
                              ))}
                            </ol>
                          )}

                          {reply.type === "timer" && (
                            <div className="mt-5 rounded-3xl bg-white p-4 ring-1 ring-slate-200">
                              <div className="flex items-center justify-between gap-4">
                                <div>
                                  <p className="text-xs font-bold uppercase tracking-[0.18em] text-coral">
                                    Focus timer
                                  </p>
                                  <p className="mt-1 text-3xl font-black tabular-nums">
                                    {minutes}:{seconds}
                                  </p>
                                </div>
                                <button
                                  onClick={() => setTimerRunning((running) => !running)}
                                  className="rounded-full bg-coral px-4 py-3 text-sm font-bold text-white transition hover:bg-[#df7d6f]"
                                >
                                  {timerRunning ? "Pause" : reply.action}
                                </button>
                              </div>
                            </div>
                          )}
                        </div>
                      </div>

                      <div className="flex flex-col gap-3 sm:flex-row sm:justify-end">
                        <button
                          onClick={() => setScreen("home")}
                          className="rounded-full bg-slate-100 px-5 py-3 text-sm font-bold text-slate-700 transition hover:bg-slate-200"
                        >
                          Edit check-in
                        </button>
                        <button
                          onClick={() => setScreen("progress")}
                          className="rounded-full bg-ink px-5 py-3 text-sm font-bold text-white shadow-lg shadow-slate-300 transition hover:-translate-y-0.5 hover:bg-slate-800"
                        >
                          Log progress
                        </button>
                      </div>
                    </div>
                  )}

                  {screen === "progress" && (
                    <div className="p-5 sm:p-8">
                      <div className="rounded-[1.5rem] bg-gradient-to-br from-emerald-50 via-white to-violet-50 p-6 ring-1 ring-slate-200">
                        <div className="flex flex-col gap-6 sm:flex-row sm:items-center sm:justify-between">
                          <div>
                            <p className="text-xs font-bold uppercase tracking-[0.22em] text-sage">
                              Progress
                            </p>
                            <h2 className="mt-2 text-4xl font-black tracking-tight">
                              Day 3 streak
                            </h2>
                            <p className="mt-3 max-w-md text-sm leading-6 text-slate-600">
                              You showed up before the motivation did. That counts.
                            </p>
                          </div>
                          <div className="grid h-28 w-28 place-items-center rounded-full bg-white shadow-sm ring-1 ring-slate-200">
                            <span className="text-3xl font-black text-coral">3</span>
                          </div>
                        </div>

                        <div className="mt-8">
                          <div className="mb-2 flex items-center justify-between text-sm font-semibold text-slate-600">
                            <span>Weekly focus goal</span>
                            <span>3 / 5 days</span>
                          </div>
                          <div className="h-4 overflow-hidden rounded-full bg-white ring-1 ring-slate-200">
                            <div className="h-full w-3/5 rounded-full bg-gradient-to-r from-sage to-lilac" />
                          </div>
                        </div>

                        <div className="mt-6 grid gap-3 sm:grid-cols-3">
                          {["Checked in", "Started small", "Protected focus"].map((item) => (
                            <div
                              key={item}
                              className="rounded-2xl bg-white px-4 py-3 text-sm font-bold text-slate-700 ring-1 ring-slate-200"
                            >
                              {item}
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="mt-6 flex flex-col gap-3 sm:flex-row sm:justify-end">
                        <button
                          onClick={resetDemo}
                          className="rounded-full bg-slate-100 px-5 py-3 text-sm font-bold text-slate-700 transition hover:bg-slate-200"
                        >
                          New check-in
                        </button>
                        <button
                          onClick={() => setScreen("response")}
                          className="rounded-full bg-ink px-5 py-3 text-sm font-bold text-white shadow-lg shadow-slate-300 transition hover:-translate-y-0.5 hover:bg-slate-800"
                        >
                          Back to AI response
                        </button>
                      </div>
                    </div>
                  )}
                </section>

                <aside className="rounded-[2rem] bg-ink p-6 text-white shadow-soft">
                  <p className="text-xs font-bold uppercase tracking-[0.22em] text-emerald-200">
                    Demo script
                  </p>
                  <h2 className="mt-3 text-2xl font-black tracking-tight">
                    Three clicks to tell the story.
                  </h2>
                  <div className="mt-6 space-y-4">
                    {[
                      ["1", "User admits the procrastination loop."],
                      ["2", "FocusLoop AI detects the pattern and gives one doable intervention."],
                      ["3", "The user logs momentum and sees a small streak reward."],
                    ].map(([number, copy]) => (
                      <div key={number} className="flex gap-3">
                        <span className="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/10 text-sm font-black">
                          {number}
                        </span>
                        <p className="pt-1 text-sm leading-6 text-slate-200">{copy}</p>
                      </div>
                    ))}
                  </div>
                  <div className="mt-8 rounded-3xl bg-white/10 p-4">
                    <p className="text-sm font-bold text-white">Keyword logic</p>
                    <p className="mt-2 text-sm leading-6 text-slate-300">
                      Try Instagram, social, phone, too big, overwhelmed, anxious, worried, or stress.
                    </p>
                  </div>
                </aside>
              </div>
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
